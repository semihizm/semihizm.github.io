<!DOCTYPE html>
<html lang="tr">

<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>anasayfa</title>
        <style>
    .kutu-grubu {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      margin-top: 20px;
    }

    .foto-kutu {
      position: relative;
      width: 300px;
      height: 100px;
      border-radius: 10px;
      overflow: hidden;
    }

    .foto-kutu img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: brightness(0.65);
    }

    .foto-yazi {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      color: #ffffff;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>

<body>
        <div class="kutu-grubu">
  <div class="foto-kutu">
    <img src="img/tmelweb.jpg" alt="temel web sitesi terimleri">
    <span class="foto-yazi">Temel web terimleri</span>
  </div>

  <div class="foto-kutu">
    <img src="img/htmltag.jpg" alt="html tagleri">
    <span class="foto-yazi">HTML etiketleri</span>
  </div>

  <div class="foto-kutu">
    <img src="img/cady.jpg" alt="Kedi sitesi">
    <span class="foto-yazi">Kedi sitesi</span>
  </div>

  <div class="foto-kutu">
    <img src="img/egzo.jpg" alt="Egzotik hayvanlar">
    <span class="foto-yazi">Egzotik hayvanlar</span>
  </div>
</div>
</body>

</html>
